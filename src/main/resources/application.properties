
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:ratingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# (Optional but clean coding practice)
spring.datasource.initialization-mode=always


jwt.secret=yourVeryLongAndSecureSecretKeyForJWTGenerationThatIsAtLeast256BitsLong
jwt.expiration=3600000


# Disable open-in-view to avoid lazy loading issues during view rendering
spring.jpa.open-in-view=false

logging.level.org.springframework.security=DEBUG